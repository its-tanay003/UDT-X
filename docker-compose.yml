services:
  # ============================================================================
  # Message Bus: Redpanda (Kafka-compatible, zero-Zookeeper, ultra-low latency)
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: udtx-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
    ports:
      - "19092:19092" # External Kafka API for host
      - "9092:9092"   # Internal Kafka API
      - "8081:8081"   # Schema Registry
      - "8082:8082"   # PandaProxy
      - "9644:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy|OK' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - udtx-network

  # Topic Provisioner: Auto-creates all necessary topics on startup
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: udtx-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating Kafka topics for UDT-X..."
        rpk topic create raw-events raw-events-dlq flow-events feature-vectors alerts raw-alerts ml-scores correlated-incidents enriched-alerts --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        echo "Listing active topics:"
        rpk topic list --brokers redpanda:9092
    networks:
      - udtx-network

  # Redpanda Console: Web UI for Kafka Topics & Schema Registry
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: udtx-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: "http://redpanda:8081"
    networks:
      - udtx-network

  # ============================================================================
  # Time-Series Storage: TimescaleDB (PostgreSQL 16 + TimescaleDB Extension)
  # ============================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: udtx-timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udtx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udtx_password}
      POSTGRES_DB: ${POSTGRES_DB:-udtx}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-udtx_user} -d ${POSTGRES_DB:-udtx}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - udtx-network

  # ============================================================================
  # Caching Layer: Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: udtx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - udtx-network

  # ============================================================================
  # Evidence Graph Database: Neo4j
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: udtx-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/udtxpassword}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - udtx-network

  # ============================================================================
  # Ingestion Services: NetFlow Listener & PCAP Reader
  # ============================================================================
  netflow-listener:
    build:
      context: .
      dockerfile: ingestion/netflow_listener/Dockerfile
    container_name: udtx-netflow-listener
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TOPIC: raw-events
    ports:
      - "2055:2055/udp"
      - "4739:4739/udp"
    networks:
      - udtx-network

  pcap-reader:
    build:
      context: .
      dockerfile: ingestion/pcap_reader/Dockerfile
    container_name: udtx-pcap-reader
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TOPIC: raw-events
    volumes:
      - ./data/pcaps:/data/pcaps
    networks:
      - udtx-network

  # ============================================================================
  # Stream Normalizer Service
  # ============================================================================
  normalizer:
    build:
      context: .
      dockerfile: normalizer/Dockerfile
    container_name: udtx-normalizer
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: raw-events
      OUTPUT_TOPIC: flow-events
      DLQ_TOPIC: raw-events-dlq
    networks:
      - udtx-network

  # ============================================================================
  # Feature Extraction Engine Service
  # ============================================================================
  features:
    build:
      context: .
      dockerfile: features/Dockerfile
    container_name: udtx-features
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: flow-events
      OUTPUT_TOPIC: feature-vectors
      REDIS_URL: redis://redis:6379/0
      WINDOW_SECONDS: 60
    networks:
      - udtx-network

  # ============================================================================
  # Phase 5a — DDoS Detection Engine
  # Consumes: feature-vectors  |  Publishes: raw-alerts
  # ============================================================================
  ddos-engine:
    build:
      context: .
      dockerfile: engines/ddos/Dockerfile
    container_name: udtx-ddos-engine
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: feature-vectors
      OUTPUT_TOPIC: raw-alerts
      KAFKA_GROUP_ID: udtx-ddos-engine
      CONFIDENCE_THRESHOLD: "0.50"
      EWMA_ALPHA: "0.20"
      WARMUP_SAMPLES: "5"
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 5b — Reconnaissance Detection Engine
  # Consumes: feature-vectors  |  Publishes: raw-alerts
  # ============================================================================
  recon-engine:
    build:
      context: .
      dockerfile: engines/recon/Dockerfile
    container_name: udtx-recon-engine
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: feature-vectors
      OUTPUT_TOPIC: raw-alerts
      KAFKA_GROUP_ID: udtx-recon-engine
      CONFIDENCE_THRESHOLD: "0.45"
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 5c — C2 Beaconing Detection Engine
  # Consumes: feature-vectors  |  Publishes: raw-alerts
  # ============================================================================
  c2-beacon-engine:
    build:
      context: .
      dockerfile: engines/c2_beacon/Dockerfile
    container_name: udtx-c2-beacon-engine
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: feature-vectors
      OUTPUT_TOPIC: raw-alerts
      KAFKA_GROUP_ID: udtx-c2-beacon-engine
      CONFIDENCE_THRESHOLD: "0.50"
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 5d — DGA & DNS Tunnelling Detection Engine
  # Consumes: feature-vectors  |  Publishes: raw-alerts
  # ============================================================================
  dga-dns-tunnel-engine:
    build:
      context: .
      dockerfile: engines/dga_dns_tunnel/Dockerfile
    container_name: udtx-dga-dns-tunnel-engine
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: feature-vectors
      OUTPUT_TOPIC: raw-alerts
      KAFKA_GROUP_ID: udtx-dga-dns-tunnel-engine
      CONFIDENCE_THRESHOLD: "0.50"
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 5e — Encrypted-Session Anomaly Detection Engine
  # Consumes: feature-vectors  |  Publishes: raw-alerts
  # ============================================================================
  encrypted-session-engine:
    build:
      context: .
      dockerfile: engines/encrypted_session/Dockerfile
    container_name: udtx-encrypted-session-engine
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: feature-vectors
      OUTPUT_TOPIC: raw-alerts
      KAFKA_GROUP_ID: udtx-encrypted-session-engine
      CONFIDENCE_THRESHOLD: "0.50"
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 5f — Data Exfiltration Detection Engine
  # Consumes: feature-vectors  |  Publishes: raw-alerts
  # ============================================================================
  exfiltration-engine:
    build:
      context: .
      dockerfile: engines/exfiltration/Dockerfile
    container_name: udtx-exfiltration-engine
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: feature-vectors
      OUTPUT_TOPIC: raw-alerts
      KAFKA_GROUP_ID: udtx-exfiltration-engine
      CONFIDENCE_THRESHOLD: "0.50"
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 6 — Behavioral Baseline Service
  # Consumes: flow-events  |  Stores: Redis & TimescaleDB Snapshots
  # ============================================================================
  baseline:
    build:
      context: .
      dockerfile: baseline/Dockerfile
    container_name: udtx-baseline
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: flow-events
      KAFKA_GROUP_ID: udtx-baseline-service
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-udtx_user}:${POSTGRES_PASSWORD:-udtx_password}@timescaledb:5432/${POSTGRES_DB:-udtx}
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 7 — ML & Anomaly Inference Engine
  # Consumes: feature-vectors  |  Publishes: ml-scores
  # ============================================================================
  ml-inference:
    build:
      context: .
      dockerfile: ml/inference/Dockerfile
    container_name: udtx-ml-inference
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: feature-vectors
      OUTPUT_TOPIC: ml-scores
      KAFKA_GROUP_ID: udtx-ml-inference-engine
      ML_REGISTRY_DIR: /app/ml/registry
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 8 — Temporal Correlation & Evidence Graph Service
  # Consumes: raw-alerts  |  Publishes: correlated-incidents  |  Graph: Neo4j
  # ============================================================================
  correlation:
    build:
      context: .
      dockerfile: correlation/Dockerfile
    container_name: udtx-correlation
    depends_on:
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: raw-alerts
      OUTPUT_TOPIC: correlated-incidents
      KAFKA_GROUP_ID: udtx-correlation-service
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-udtxpassword}
      CORRELATION_WINDOW_MINUTES: "30"
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # Phase 9 — Threat Intelligence & MITRE Mapping Service
  # Consumes: raw-alerts  |  Publishes: enriched-alerts
  # ============================================================================
  intel:
    build:
      context: .
      dockerfile: intel/Dockerfile
    container_name: udtx-intel
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INPUT_TOPIC: raw-alerts
      OUTPUT_TOPIC: enriched-alerts
      KAFKA_GROUP_ID: udtx-intel-enrichment-service
      MITRE_MAP_PATH: /app/intel/mitre_map.json
      IOC_FEED_PATH: /app/intel/data/sample_iocs.json
    restart: unless-stopped
    networks:
      - udtx-network

  # ============================================================================
  # API Service: FastAPI Core Service
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: udtx-api
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-udtx_user}:${POSTGRES_PASSWORD:-udtx_password}@timescaledb:5432/${POSTGRES_DB:-udtx}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-udtxpassword}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - udtx-network

  # ============================================================================
  # Phase 11 — SOC Dashboard (React + TypeScript Web UI)
  # ============================================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: udtx-dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - udtx-network

networks:
  udtx-network:
    driver: bridge
    name: udtx-network

volumes:
  redpanda_data:
    name: udtx_redpanda_data
  timescaledb_data:
    name: udtx_timescaledb_data
  redis_data:
    name: udtx_redis_data
  neo4j_data:
    name: udtx_neo4j_data
